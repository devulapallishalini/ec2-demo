name: Terraform

# Pull request -> plan dev and post the plan as a PR comment.
# Merge to main -> apply dev only.
# Manual run    -> plan, apply or destroy dev.

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".terraform.lock.hcl"
      - ".tflint.hcl"
      - "keys/**"
      - "monitoring/**"
      - "tests/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: ["**"]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".terraform.lock.hcl"
      - ".tflint.hcl"
      - "keys/**"
      - "monitoring/**"
      - "tests/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Only the dev environment is enabled to limit costs"
        type: choice
        options: [dev]
        default: dev
      action:
        description: "What to do"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  pull-requests: write # to comment the plan on PRs

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.16.4"
  AWS_REGION: ap-south-1

jobs:
  checks:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Initialize providers
        run: terraform init -backend=false -lockfile=readonly

      - name: Validate
        run: terraform validate -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint plugins
        run: tflint --init

      - name: Lint Terraform
        run: tflint --recursive --minimum-failure-severity=warning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test monitoring script
        run: python -m unittest discover -s tests -v

  # ---------------------------------------------------------------------------
  # Pull requests: check formatting, validate, and plan the dev environment.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan (${{ matrix.env }})
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        env: [dev]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init

      - name: Select workspace
        run: terraform workspace select -or-create ${{ matrix.env }}

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        run: |
          terraform plan -no-color -lock-timeout=5m \
            -var-file=${{ matrix.env }}.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Add plan to run summary
        run: |
          {
            echo "### Terraform plan: ${{ matrix.env }}"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per environment, updated on every new push to the PR.
      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENV_NAME;
            const marker = `<!-- terraform-plan-${env} -->`;
            let plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = (plan.match(/^Plan: .*$|^No changes\..*$/m) || ['(see run log)'])[0];
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, see run summary)';
            const body = [
              marker,
              `### Terraform plan: \`${env}\``,
              `**${summary}**`,
              '<details><summary>Show full plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
              '',
              `_Commit ${context.sha.slice(0, 7)}, [run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # ---------------------------------------------------------------------------
  # Merge to main: apply dev only.
  # ---------------------------------------------------------------------------
  apply:
    name: Apply (${{ matrix.env }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        env: [dev]
    environment: ${{ matrix.env }}
    concurrency:
      group: terraform-${{ matrix.env }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init

      - name: Select workspace
        run: terraform workspace select -or-create ${{ matrix.env }}

      - name: Plan
        run: terraform plan -no-color -lock-timeout=5m -var-file=${{ matrix.env }}.tfvars -out=tfplan

      - name: Apply
        run: terraform apply -no-color -lock-timeout=5m tfplan

      - name: Show outputs
        run: terraform output -no-color >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Manual run from the Actions tab: plan, apply or destroy one environment.
  # ---------------------------------------------------------------------------
  manual:
    name: ${{ inputs.action }} (${{ inputs.environment }})
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init

      - name: Select workspace
        run: terraform workspace select -or-create ${{ inputs.environment }}

      - name: Plan
        run: |
          DESTROY_FLAG=""
          if [ "${{ inputs.action }}" = "destroy" ]; then DESTROY_FLAG="-destroy"; fi
          terraform plan -no-color -lock-timeout=5m $DESTROY_FLAG \
            -var-file=${{ inputs.environment }}.tfvars -out=tfplan

      - name: Apply
        if: inputs.action != 'plan'
        run: terraform apply -no-color -lock-timeout=5m tfplan
